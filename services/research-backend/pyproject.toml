[project]
name = "purchase-research-backend"
version = "0.1.0"
description = "MCP, API, persistence, and analysis backend for grounded product research"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
purchase-research-mcp = "research_backend.interfaces.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
