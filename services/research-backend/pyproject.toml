[project]
name = "purchase-research-backend"
version = "0.1.0"
description = "MCP, API, persistence, and analysis backend for grounded product research"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<2",
    "httpx>=0.28,<1",
    "pika>=1.3,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[project.scripts]
purchase-research-mcp = "research_backend.interfaces.mcp.server:main"
purchase-research-collect = "research_backend.interfaces.cli.collect_search:main"
purchase-research-enqueue = "research_backend.interfaces.cli.enqueue_search:main"
purchase-research-result-worker = "research_backend.interfaces.cli.consume_results:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
