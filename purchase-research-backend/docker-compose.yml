services:
  mysql:
    image: mysql:8.4
    container_name: purchase-research-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: purchase_research
      MYSQL_USER: purchase_research
      MYSQL_PASSWORD: purchase_research
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - purchase_research_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  purchase_research_mysql_data:
