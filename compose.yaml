name: purchase-research-agent

services:
  postgres:
    image: postgres:16-alpine
    # 루트 .env 값이 있으면 사용하고, 없으면 :- 뒤의 로컬 개발 기본값을 사용한다.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-purchase_research}
      POSTGRES_USER: ${POSTGRES_USER:-purchase_research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purchase_research}
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    volumes:
      - purchase_research_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ./services/research-backend
    environment:
      # PostgreSQL과 같은 .env 값을 사용해 Alembic 접속 주소를 조합한다.
      PURCHASE_RESEARCH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-purchase_research}:${POSTGRES_PASSWORD:-purchase_research}@postgres:5432/${POSTGRES_DB:-purchase_research}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    profiles: ["tools"]
    restart: "no"

volumes:
  purchase_research_postgres_data:
