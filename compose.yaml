name: purchase-research-agent

services:
  postgres:
    image: postgres:16-alpine
    # 루트 .env 값이 있으면 사용하고, 없으면 :- 뒤의 로컬 개발 기본값을 사용한다.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-purchase_research}
      POSTGRES_USER: ${POSTGRES_USER:-purchase_research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purchase_research}
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    volumes:
      - purchase_research_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    environment:
      # 루트 .env의 비밀번호를 Redis 실행 명령과 health check가 함께 사용한다.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-purchase_research}
    ports:
      - "${REDIS_PORT:-36379}:6379"
    volumes:
      - purchase_research_redis_data:/data
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-purchase_research}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-purchase_research}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-purchase_research}
    ports:
      - "${RABBITMQ_AMQP_PORT:-35672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-35673}:15672"
    volumes:
      - purchase_research_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  purchase_research_postgres_data:
  purchase_research_redis_data:
  purchase_research_rabbitmq_data:
